name: XecureCode Auto-Rollback

on:
  repository_dispatch:
    types: [xecurecode-rollback]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Target commit SHA to rollback to'
        required: true
        default: ''

concurrency:
  group: xecurecode-rollback-main
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back xecure-commerce
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.target_sha || github.event.inputs.target_sha }}
          fetch-depth: 0

      - name: Revert to target commit without destructive force-push
        run: |
          set -euo pipefail
          TARGET_SHA="${{ github.event.client_payload.target_sha || github.event.inputs.target_sha }}"
          echo "Rolling back branch main to healthy release: $TARGET_SHA"
          git config user.name "XecureCode Bot"
          git config user.email "bot@xecurecode.in"
          git fetch origin main
          git checkout main
          git merge "$TARGET_SHA" --no-ff -m "Auto-rollback: revert to healthy release $TARGET_SHA"
          git push origin main
