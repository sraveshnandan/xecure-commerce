name: Multi-Commerce Microservices CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-microservices:
    name: Verify Node, Python, and Java Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify Node Checkout Service
        run: |
          cd services/checkout-service
          node --check src/server.mjs

      - name: Verify Python Catalog Service
        run: |
          python3 -m py_compile services/catalog-service/app.py

      - name: Verify Java Inventory Service
        run: |
          find services/inventory-service -name "*.java"
